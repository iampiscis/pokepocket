<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<meta name="viewport" content="width=1200" />
<title>Prévia dos Shinies 24h</title>
<link rel="stylesheet" href="base.css" />
<style>
.fundo { background: radial-gradient(48% 75% at 76% 50%, #4a1f3c 0%, transparent 70%), radial-gradient(30% 40% at 88% 18%, rgba(255, 126, 200, 0.16), transparent 70%), radial-gradient(30% 30% at 10% 85%, rgba(140, 120, 255, 0.1), transparent 70%), #0b0608; }
.raios { left: 878px; background: repeating-conic-gradient(rgba(255, 220, 140, 0.09) 0deg 5deg, transparent 5deg 20deg); }
h1 { margin-top: 20px; font-family: "Lilita"; font-weight: 400; font-size: 92px; line-height: 0.92; letter-spacing: 0.01em; text-transform: uppercase; }
h1 span { display: block; background: linear-gradient(180deg, #fffbe0 0%, #ffe066 40%, #ffb020 66%, #e8650f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #3b1208); }
h1 span + span { background: linear-gradient(180deg, #fff0fb 0%, #ff9fd8 45%, #e2489a 100%); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 4px 0 #3a0a24); }
.sub { margin-top: 16px; font-size: 24px; font-weight: 900; color: #fff3df; }
.nums { display: flex; gap: 10px; margin-top: 20px; }
.num { display: grid; gap: 2px; padding: 10px 16px 9px; border-radius: 16px; background: rgba(255, 233, 163, 0.07); box-shadow: inset 0 0 0 1.5px rgba(255, 233, 163, 0.22); }
.num b { font-family: "Lilita"; font-weight: 400; font-size: 34px; line-height: 1; color: #ffe066; }
.num.rosa b { color: #ff9fd8; }
.num small { font-size: 14px; font-weight: 900; color: #e8d8c6; text-transform: uppercase; letter-spacing: 0.06em; }
.lista { margin-top: 20px; gap: 9px; }
.lista li { font-size: 19px; }
.botao { margin-top: 24px; font-size: 20px; padding: 12px 26px; }

.palco { position: absolute; left: 600px; top: 0; width: 560px; height: 630px; }
.aura { position: absolute; left: 280px; top: 300px; width: 420px; height: 420px; margin: -210px 0 0 -210px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 214, 110, 0.42), rgba(255, 126, 200, 0.18) 55%, transparent); }
.chao { position: absolute; left: 280px; top: 438px; width: 300px; height: 46px; margin-left: -150px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 220, 140, 0.5), transparent); }
.heroi { position: absolute; left: 280px; top: 300px; display: grid; place-items: center; width: 290px; height: 290px; margin: -170px 0 0 -145px; }
.heroi img { image-rendering: pixelated; filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 22px rgba(255, 220, 140, 0.45)); }
.placa { position: absolute; left: 280px; top: 478px; display: flex; align-items: center; gap: 14px; padding: 10px 18px 10px 14px; border-radius: 18px; transform: translateX(-50%); white-space: nowrap; background: linear-gradient(180deg, rgba(43, 22, 32, 0.96), rgba(24, 12, 18, 0.96)); box-shadow: 0 0 0 2px #e2a93f, 0 0 0 5px rgba(255, 233, 163, 0.16), 0 14px 30px rgba(0, 0, 0, 0.5); }
.placa .sc { display: grid; justify-items: center; line-height: 1; padding-right: 14px; border-right: 1px solid rgba(255, 233, 163, 0.2); }
.placa .sc b { font-family: "Lilita"; font-weight: 400; font-size: 40px; color: #5ee69a; text-shadow: 0 0 16px rgba(94, 230, 154, 0.5); }
.placa .sc small { margin-top: 3px; font-size: 12px; font-weight: 900; color: #5ee69a; letter-spacing: 0.08em; }
.placa .qm { display: grid; gap: 3px; }
.placa .qm b { font-size: 23px; font-weight: 900; color: #fff3df; }
.placa .qm b i { font-style: normal; color: #ffe066; }
.placa .qm small { font-size: 15px; font-weight: 800; color: #d8c4b4; }
.mini { position: absolute; display: grid; place-items: center; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 233, 163, 0.2), rgba(40, 18, 30, 0.92) 70%); box-shadow: inset 0 0 0 2px rgba(255, 233, 163, 0.35), 0 10px 22px rgba(0, 0, 0, 0.45); }
.mini img { image-rendering: pixelated; filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.6)); }
.mini em { position: absolute; bottom: -12px; padding: 1px 9px; border-radius: 999px; font-style: normal; font-family: "Lilita"; font-size: 17px; color: #10261a; background: linear-gradient(180deg, #9cf5c1, #3fcf7e); box-shadow: 0 2px 0 #1d6b40; }
.br { position: absolute; color: #fff3c4; text-shadow: 0 0 12px #ffd34d, 0 0 26px rgba(255, 126, 200, 0.6); line-height: 1; }
</style>
</head>
<body>
<div class="fundo"></div><div class="raios"></div><div class="moldura"></div>
<div class="esq">
  <div class="marca"><img src="../../assets/icone.png" alt="" /><span><span class="p">Poke</span>Pocket</span></div>
  <h1><span>Shinies</span><span>24h</span></h1>
  <p class="sub">Todo shiny que saiu no servidor hoje.</p>
  <div class="nums"><span class="num"><b id="n-total">—</b><small>shinies</small></span><span class="num rosa"><b id="n-venda">—</b><small>à venda</small></span><span class="num"><b id="n-top">—</b><small>melhor score</small></span></div>
  <ul class="lista">
    <li><i></i>Nota, Score PvP e PvE de cada um</li>
    <li><i></i>Filtros de nota, nível, score e dono</li>
  </ul>
  <span class="botao">Grátis, no navegador</span>
</div>
<div class="palco" id="palco">
  <div class="aura"></div><div class="chao"></div>
</div>
<script>
const SPR = '../../calculadora/jogo/sprites-png/'
const fmt = new Intl.NumberFormat('pt-BR')
const score = (v) => { if (!(v > 0)) return 0; const x = Math.max(0, Math.min(1, (Math.log10(v) - 1) / (Math.log10(25000) - 1))); return Math.round(1000 * x ** 1.8) }
const faixa = (s) => (s >= 700 ? 'EXCELENTE' : s >= 500 ? 'BOM' : s >= 300 ? 'REGULAR' : 'BAIXO')
const carregar = (l) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = `${SPR}${l.look}.png` })
const escalar = (img, caixa) => { const k = Math.max(1, Math.floor(caixa / Math.max(img.naturalWidth, img.naturalHeight))); img.width = img.naturalWidth * k; img.height = img.naturalHeight * k; return img }
const brilho = (x, y, t) => { const s = document.createElement('i'); s.className = 'br'; s.textContent = '✦'; s.style.cssText = `left:${x}px;top:${y}px;font-size:${t}px`; return s }
fetch('../../shinies/shinies.json').then((r) => r.json()).then(async (d) => {
  const ls = d.linhas || []
  document.getElementById('n-total').textContent = fmt.format(ls.length)
  document.getElementById('n-venda').textContent = fmt.format(ls.filter((l) => l.an).length)
  const vistos = new Set()
  const ord = [...ls].sort((a, b) => (b.fz?.pvp || 0) - (a.fz?.pvp || 0)).filter((l) => !vistos.has(l.sp) && vistos.add(l.sp))
  const escolhidos = []
  for (const l of ord) {
    const img = await carregar(l)
    if (img) escolhidos.push([l, img])
    if (escolhidos.length >= 10) break
  }
  const palco = document.getElementById('palco')
  const iH = Math.max(0, escolhidos.findIndex(([, img]) => Math.max(img.naturalWidth, img.naturalHeight) >= 48))
  const h = escolhidos[iH]
  const outros = escolhidos.filter((_, i) => i !== iH)
  const sh = score(h[0].fz?.pvp)
  document.getElementById('n-top').textContent = fmt.format(Math.max(...escolhidos.map(([l]) => score(l.fz?.pvp))))
  const heroi = document.createElement('div'); heroi.className = 'heroi'; heroi.append(escalar(h[1], 250)); palco.append(heroi)
  const placa = document.createElement('div'); placa.className = 'placa'
  placa.innerHTML = `<span class="sc"><b>${sh}</b><small>${faixa(sh)}</small></span><span class="qm"><b><i>✦</i> ${h[0].nome} · Nv ${fmt.format(h[0].nv)}</b><small>capturado por ${h[0].dono}</small></span>`
  palco.append(placa)
  const pos = [[78, 150], [482, 150], [64, 396], [496, 396]]
  outros.slice(0, 4).forEach(([l, img], i) => {
    const m = document.createElement('div'); m.className = 'mini'; m.style.left = `${pos[i][0]}px`; m.style.top = `${pos[i][1]}px`
    m.append(escalar(img, 70))
    const e = document.createElement('em'); e.textContent = score(l.fz?.pvp); m.append(e)
    palco.append(m)
  })
  for (const [x, y, t] of [[196, 92, 34], [372, 120, 22], [418, 70, 16], [150, 250, 18], [402, 300, 28], [250, 56, 14], [520, 270, 16], [30, 260, 14]]) palco.append(brilho(x, y, t))
})
</script>
</body>
</html>
