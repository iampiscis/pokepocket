name: Atualizar meta PvP e tier

on:
  schedule:
    - cron: '7 14 * * *'
    - cron: '37 15 * * *'
    - cron: '17 17 * * *'
  workflow_dispatch:
    inputs:
      so_se_faltar:
        description: Pular se o tier de hoje já saiu
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: atualizar-meta
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Ver se o tier de hoje já saiu
        id: hoje
        run: |
          feito=nao
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.so_se_faltar }}" = "true" ]; then
            gerado=$(jq -r '.geradoEm // empty' tier/tier.json 2>/dev/null || true)
            if [ -n "$gerado" ] && [ "$(TZ=America/Sao_Paulo date -d "$gerado" +%F)" = "$(TZ=America/Sao_Paulo date +%F)" ]; then
              feito=sim
              echo "o tier de hoje já saiu ($gerado); nada a fazer"
            fi
          fi
          echo "feito=$feito" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.hoje.outputs.feito != 'sim'
        with:
          node-version: 20

      - name: Baixar as passadas das últimas 30 horas
        if: steps.hoje.outputs.feito != 'sim'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p coleta/passadas
          desde=$(date -u -d '30 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=0
          for pagina in 1 2 3; do
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=coleta-pvp&per_page=100&page=$pagina" --jq ".artifacts[] | select(.expired == false and .created_at >= \"$desde\") | .id")
            [ -z "$ids" ] && break
            for id in $ids; do
              if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > coleta/a.zip 2>/dev/null && unzip -oq coleta/a.zip -d "coleta/passadas/$id"; then n=$((n + 1)); fi
              sleep 0.3
            done
          done
          rm -f coleta/a.zip
          echo "$n passadas baixadas"

      - name: Coletar ranqueado e recalcular
        if: steps.hoje.outputs.feito != 'sim'
        run: node ferramentas/atualizar-meta.mjs
        env:
          META_PVP_PASSADAS: coleta/passadas
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Gerar prévia do tier
        if: steps.hoje.outputs.feito != 'sim'
        continue-on-error: true
        run: node ferramentas/previa-tier.mjs

      - name: Esperar até 12h de Brasília
        if: github.event_name == 'schedule' && steps.hoje.outputs.feito != 'sim'
        run: |
          alvo=$(date -u -d "$(date -u +%Y-%m-%d) 15:00:00" +%s)
          agora=$(date -u +%s)
          espera=$(( alvo - agora - 45 ))
          if [ "$espera" -gt 0 ]; then
            echo "publicando às 12h em $(( espera / 60 )) min"
            sleep "$espera"
          fi

      - name: Publicar se mudou
        if: steps.hoje.outputs.feito != 'sim'
        run: |
          git add -A calculadora/meta-pvp.json tier/tier.json tier/dados assets/previa-tier.png tier/index.html
          if git diff --cached --quiet; then
            echo "nada mudou"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: meta PvP e tier $(date -u +%Y-%m-%d)"
          for t in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
